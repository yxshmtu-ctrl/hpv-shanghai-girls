# ===== HPV 疫苗上海免费政策 · 可更新配置 =====
# ★★★ 政策/时效内容一律改这里，不要改 SKILL.md ★★★
# 依据：疾控U健康官方推文 + 沪疾控局卫免〔2026〕1号 等
# 快照日期：2026-08-28 —— 使用前建议核对最新官方公告

free_policy:
  enabled: true
  national_start_date: "2025-11-10"
  # 免费资格（两个条件同时满足）
  birth_after: "2011-11-10"        # 此日期之后出生
  age_from: 13                      # 满13周岁
  age_to: null                      # null=不设上限（只要符合出生+年龄条件）
  sex: female
  # 免费疫苗
  vaccine_type: "国产双价HPV"       # 双价
  doses: 2
  interval_months: 6                # 两剂间隔6个月（最好不超过1年）
  notes:
    - "错过13岁可免费补种（查漏补种常态化）"
    - "已自费全程四/九价：视同完成，不重复接种"
    - "已自费1剂：可再接种1剂免费完成全程"
    - "是否接种不影响入学"

booking:
  channel_primary: "随申办App/小程序 → 智慧接种"
  channel_secondary: "健康云App/小程序 → 智慧接种"
  flow:
    - "登记接种意愿"
    - "等待接种门诊接种告知短信"
    - "按短信预约具体时间"
  hotline: "400-9216-519"          # 健康云客服
  hotline_sh_health: "12320"       # 上海卫生健康热线(咨询答疑, 见沪疾控局卫免〔2026〕1号)

documents_needed:
  - "监护人陪同"
  - "监护人及孩子身份证件（身份证/户口本）"
  - "预防接种证"
  - "学校临时点：监护人签署的知情同意书"

# 优惠减免活动（高时效，随企业让利变化，频繁更新）
offers:
  nine_valent_hpv:
    note: "示例：第1剂自费+后续剂次减免；首针截止时间以官方为准"
    deadline_note: "活动时效性强，回答前必须核实当前是否仍有效"
  note: "详见官方最新推文，勿凭本快照回答时效性问题"

# 接种门诊（动态）
points:
  note: "浦东各社区卫生服务中心接种门诊名单 → 官方推文《家长请查收》/ 健康云查询"
  source: "疾控U健康公众号 / 健康云"
